<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosmos Atlas | 우주 탐험</title>
<style>
:root{--bg:#050611;--panel:#101326;--line:#292d50;--blue:#63a9ff;--purple:#b27bff;--text:#f5f6ff;--muted:#b8bfdc}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);background:radial-gradient(ellipse at 15% 5%,#20245b88,transparent 35%),radial-gradient(ellipse at 85% 25%,#51256b55,transparent 32%),var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.65}
header{padding:52px 18px 32px;text-align:center;position:relative;overflow:hidden}header:before{content:"";position:absolute;width:260px;height:260px;background:#4d65ff35;filter:blur(65px);top:-150px;left:calc(50% - 130px);pointer-events:none}
.eyebrow{color:#b8a4ff;letter-spacing:.2em;font-size:.78rem;font-weight:800}.logo{font-size:clamp(2.3rem,8vw,4.5rem);line-height:1.1;margin:12px 0;background:linear-gradient(100deg,#fff,#8ec8ff,#c9a4ff);color:transparent;background-clip:text}.subtitle{color:var(--muted);max-width:620px;margin:12px auto 24px}
main{width:min(1080px,92%);margin:auto}.search-wrap{max-width:720px;margin:0 auto 28px;padding:18px;border:1px solid #454b80;border-radius:18px;background:#101326d9;box-shadow:0 0 34px #5a56ff20}
.search-label{display:block;font-weight:800;margin:0 0 8px;color:#d6d0ff}.search-row{display:flex;gap:8px}input,button{font:inherit}input[type=search]{width:100%;min-width:0;padding:13px 14px;border-radius:11px;border:1px solid #42486e;background:#070916;color:white;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #63a9ff20}button{cursor:pointer;color:white;border:1px solid #545c91;background:linear-gradient(120deg,#27356e,#482b70);padding:11px 15px;border-radius:11px;font-weight:750}button:hover{filter:brightness(1.18)}.hint{font-size:.84rem;color:var(--muted);margin:9px 2px 0}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:34px 0 15px}.section-title h2{margin:0;font-size:1.5rem}.section-title p{margin:0;color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:linear-gradient(145deg,#151a33ed,#0b0e1dec);border:1px solid var(--line);border-radius:17px;padding:19px;transition:transform .18s,border-color .18s;box-shadow:0 8px 30px #0002}.card:hover{transform:translateY(-3px);border-color:#7276c5}.icon{font-size:2rem}.card h3{margin:6px 0 4px}.card p{color:var(--muted);font-size:.93rem;margin:0 0 14px}.card button{width:100%}.empty{color:var(--muted);padding:18px;text-align:center;grid-column:1/-1}
.detail{display:none;margin-top:20px;padding:22px;border-radius:18px;border:1px solid #5c62a5;background:linear-gradient(140deg,#171c39,#0c0e1d);box-shadow:0 0 32px #5b54ff1a}.detail.show{display:block}.detail h2{margin-top:0}.detail .lead{font-size:1.05rem;color:#e4e7ff}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:16px 0}.fact{padding:12px;border-radius:12px;background:#080b18;border:1px solid #252b4d}.fact b{display:block;color:#a9caff;font-size:.85rem}.fact span{display:block;margin-top:4px}.detail ul{padding-left:22px;color:#d3d8f3}.close{float:right}
.quiz{margin:34px 0;padding:22px;border-radius:20px;border:1px solid #41487c;background:linear-gradient(135deg,#12172e,#171027);box-shadow:0 0 35px #6a49ff15}.quiz h2{margin:0}.quiz-intro{color:var(--muted);margin:6px 0 18px}.q-card{padding:16px;margin:12px 0;background:#080b19;border:1px solid #292e50;border-radius:14px}.q-card p{font-weight:750;margin:0 0 10px}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.answers button{background:#171d38;border-color:#363e68;text-align:left}.answers button.selected{border-color:#a18bff;background:#34245e}.answers button.correct{border-color:#4bd6a0;background:#12372f}.answers button.wrong{border-color:#ff879c;background:#451d2a}.feedback{font-size:.9rem;color:#c9d0ed;margin-top:8px;min-height:1.4em}.quiz-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}.score{font-weight:800;color:#c8b6ff}
footer{text-align:center;color:#8f97bc;padding:36px 15px 48px;font-size:.88rem}
@media(max-width:520px){header{padding-top:38px}.search-row{flex-direction:column}.search-row button{width:100%}.section-title{align-items:start;flex-direction:column}.detail{padding:16px}}
</style>
</head>
<body>
<header>
<div class="eyebrow">EXPLORE THE UNIVERSE</div>
<h1 class="logo">COSMOS ATLAS</h1>
<p class="subtitle">우주의 다양한 천체를 탐험하고, 새로운 사실을 배우고, 퀴즈로 지식을 확인해 보세요.</p>
</header>
<main>
<section class="search-wrap" aria-label="천체 검색">
<label class="search-label" for="search">검색할 수 있는 것들</label>
<div class="search-row"><input id="search" type="search" placeholder="예: 토성, 혜성, 위성, 태양계" autocomplete="off"><button id="clearSearch" type="button">검색 초기화</button></div>
<p class="hint">천체 이름이나 설명의 단어를 입력하면 관련 항목을 찾아줘요.</p>
</section>
<div class="section-title"><h2>우주 탐험 목록</h2><p id="count">9개 분야</p></div>
<section id="cards" class="grid" aria-live="polite"></section>
<section id="detail" class="detail" aria-live="polite"></section>
<section class="quiz" id="quiz">
<h2>🧠 우주 지식 퀴즈</h2><p class="quiz-intro">문제를 읽고 정답을 선택한 다음 채점하기를 눌러 보세요.</p>
<div id="questions"></div>
<div class="quiz-actions"><button id="grade">채점하기</button><button id="resetQuiz">다시 풀기</button><span class="score" id="score" aria-live="polite"></span></div>
</section>
</main>
<footer> COSMOS ATLAS · 호기심에서 시작하는 우주 탐험 </footer>
<script>
const objects=[
{id:"sun",name:"태양",icon:"☀️",short:"태양계 중심에서 빛과 열을 내는 별",keywords:"항성 핵융합 태양풍 흑점",lead:"태양은 태양계 중심에 있는 별이며, 태양계 전체 질량의 대부분을 차지합니다. 중심부에서 일어나는 핵융합 반응이 빛과 열의 에너지원입니다.",facts:[["종류","G형 주계열성"],["나이","약 46억 년"],["지름","약 139만 km"],["주요 구성","수소와 헬륨"]],more:["태양의 에너지는 핵에서 수소가 헬륨으로 바뀌는 핵융합 과정에서 만들어집니다.","태양 표면에서 보이는 어두운 영역을 흑점이라고 하며 주변보다 온도가 낮습니다.","태양에서 흘러나오는 전하 입자의 흐름을 태양풍이라고 합니다."]},
{id:"planet",name:"행성",icon:"🪐",short:"별 주위를 돌며 자기 중력으로 둥근 천체",keywords:"수성 금성 지구 화성 목성 토성 천왕성 해왕성 공전 자전",lead:"행성은 별 주위를 공전하고, 자체 중력으로 거의 둥근 모양을 이루며, 궤도 주변의 다른 천체들을 대부분 정리한 천체입니다. 태양계에는 여덟 행성이 있습니다.",facts:[["개수","태양계 8개"],["안쪽 행성","수성·금성·지구·화성"],["바깥쪽 행성","목성·토성·천왕성·해왕성"],["운동","공전과 자전"]],more:["수성·금성·지구·화성은 암석형 행성입니다.","목성과 토성은 거대 가스 행성이고, 천왕성과 해왕성은 얼음 거대 행성으로 분류됩니다.","행성마다 태양을 한 바퀴 도는 데 걸리는 시간과 하루의 길이가 다릅니다."]},
{id:"dwarf",name:"왜소행성",icon:"🌑",short:"둥글지만 궤도 주변을 정리하지 못한 천체",keywords:"명왕성 세레스 에리스 하우메아 마케마케",lead:"왜소행성은 태양 주위를 돌고 자체 중력으로 거의 둥글지만, 궤도 주변의 다른 천체들을 정리하지 못했으며 위성이 아닌 천체입니다.",facts:[["대표 예","명왕성·세레스·에리스"],["모양","거의 둥근 형태"],["공통점","태양 주위를 공전"],["차이","궤도 주변을 정리하지 못함"]],more:["명왕성은 2006년 국제천문연맹의 행성 정의에 따라 왜소행성으로 분류되었습니다.","세레스는 소행성대에 있는 왜소행성입니다.","왜소행성은 행성보다 작다고만 정의되는 것이 아니라 궤도 주변을 정리했는지가 중요한 기준입니다."]},
{id:"asteroid",name:"소행성",icon:"☄️",short:"태양 주위를 도는 작은 암석질 천체",keywords:"소행성대 암석 충돌 베누 베스타",lead:"소행성은 태양 주위를 도는 작은 암석질 또는 금속질 천체입니다. 많은 소행성이 화성과 목성 사이의 소행성대에 모여 있습니다.",facts:[["주요 분포","화성과 목성 사이"],["구성","암석과 금속 등"],["모양","불규칙한 경우가 많음"],["예시","베스타·베누"]],more:["소행성은 태양계가 형성될 때 남은 물질에 대한 단서를 제공합니다.","일부 소행성은 지구 가까이까지 접근하므로 과학자들이 궤도를 관측합니다.","대부분은 행성보다 훨씬 작고 불규칙한 모양을 하고 있습니다."]},
{id:"comet",name:"혜성",icon:"☄️",short:"얼음과 먼지 등이 태양 가까이에서 꼬리를 만드는 천체",keywords:"얼음 먼지 코마 꼬리 핼리 혜성",lead:"혜성은 얼음, 먼지, 암석 성분 등을 포함한 천체입니다. 태양 가까이 다가가면 표면 물질이 기체로 변하면서 주변에 코마와 꼬리가 만들어질 수 있습니다.",facts:[["주요 구성","얼음·먼지·암석"],["활동","태양 가까이에서 가스와 먼지 방출"],["꼬리 방향","대체로 태양 반대쪽"],["유명한 예","핼리 혜성"]],more:["혜성의 꼬리는 혜성이 이동하는 방향과 항상 같은 방향을 향하지 않습니다.","태양빛과 태양풍이 혜성의 먼지와 이온 꼬리에 영향을 줍니다.","핼리 혜성은 약 76년 주기로 태양 근처에 돌아오는 것으로 알려져 있습니다."]},
{id:"moon",name:"위성",icon:"🌙",short:"행성이나 왜소행성 등 다른 천체를 도는 천체",keywords:"달 자연 위성 인공위성 가니메데 타이탄",lead:"자연 위성은 행성이나 왜소행성 같은 다른 천체의 주위를 도는 천체입니다. 지구의 자연 위성은 달입니다. 인공위성은 사람이 만든 장치입니다.",facts:[["지구의 위성","달"],["큰 자연 위성 예","가니메데·타이탄"],["자연 위성","자연적으로 형성된 천체"],["인공위성","사람이 만든 장치"]],more:["목성의 가니메데는 태양계에서 가장 큰 자연 위성으로 알려져 있습니다.","토성의 타이탄에는 두꺼운 대기와 액체 탄화수소 호수가 있습니다.","인공위성은 통신, 위치 측정, 기상 관측과 과학 연구 등에 사용됩니다."]},
{id:"star",name:"별",icon:"✨",short:"스스로 빛과 에너지를 내는 뜨거운 천체",keywords:"항성 별빛 핵융합 적색거성 백색왜성",lead:"일상에서 말하는 별은 대체로 스스로 빛을 내는 항성을 뜻합니다. 대부분의 항성은 중심부에서 핵융합을 통해 에너지를 만듭니다.",facts:[["에너지원","대부분 중심부의 핵융합"],["색과 온도","푸른 별이 붉은 별보다 표면 온도가 높은 편"],["가장 가까운 항성","태양"],["빛","스스로 방출"]],more:["별의 색은 표면 온도와 관련이 있습니다.","별은 질량에 따라 수명과 마지막 단계가 달라집니다.","밤하늘에서 별이 반짝여 보이는 것은 지구 대기의 영향이 큽니다."]},
{id:"fixedstar",name:"항성",icon:"🌟",short:"중력으로 뭉쳐 있으며 스스로 빛을 내는 천체",keywords:"항성 별 태양 시리우스 프록시마 센타우리",lead:"항성은 중력으로 뭉친 뜨거운 기체와 플라스마로 이루어져 있으며 스스로 빛을 내는 천체입니다. 태양도 항성입니다. '붙박이별'이라는 옛 표현은 별들이 서로의 위치를 거의 바꾸지 않는 것처럼 보인 데서 왔습니다.",facts:[["대표 항성","태양·시리우스"],["에너지","대부분 핵융합"],["거리 단위","광년을 자주 사용"],["움직임","실제로는 우주 공간에서 움직임"]],more:["항성도 은하 안에서 움직이며, 태양 역시 은하 중심을 공전합니다.","태양 이외의 항성은 너무 멀리 있어 맨눈으로는 점처럼 보입니다.","별의 밝기는 실제 밝기뿐 아니라 지구와의 거리에도 영향을 받습니다."]},
{id:"celestial",name:"천체",icon:"🌌",short:"우주 공간에 존재하는 자연적인 물체나 구조",keywords:"행성 항성 위성 은하 성운 블랙홀 우주",lead:"천체는 우주에 존재하는 자연적인 물체를 폭넓게 가리키는 말입니다. 행성, 항성, 위성, 소행성, 혜성뿐 아니라 은하와 성운 등도 천문학에서 연구하는 대상입니다.",facts:[["예시","별·행성·위성·은하·성운"],["연구 분야","천문학"],["관측 방법","망원경·우주 탐사선 등"],["규모","작은 먼지부터 거대한 은하까지"]],more:["천문학자들은 가시광선뿐 아니라 전파, 적외선, X선 등 여러 파장의 빛을 관측합니다.","멀리 있는 천체를 관측하면 그 빛이 출발한 과거의 모습을 보게 됩니다.","천체의 움직임과 빛을 분석하면 구성 성분, 온도, 거리 등을 알아낼 수 있습니다."]}
];
const cards=document.getElementById("cards"),detail=document.getElementById("detail"),search=document.getElementById("search"),count=document.getElementById("count");
function render(list){cards.innerHTML="";count.textContent=`${list.length}개 항목`;if(!list.length){cards.innerHTML='<p class="empty">검색 결과가 없어. 다른 단어로 검색해 봐.</p>';return}list.forEach(o=>{const el=document.createElement("article");el.className="card";el.innerHTML=`<div class="icon">${o.icon}</div><h3>${o.name}</h3><p>${o.short}</p><button type="button" data-id="${o.id}">자세히 알아보기 →</button>`;cards.appendChild(el)})}
function showDetail(id){const o=objects.find(x=>x.id===id);if(!o)return;detail.innerHTML=`<button class="close" id="closeDetail" type="button">닫기 ✕</button><div class="icon">${o.icon}</div><h2>${o.name}</h2><p class="lead">${o.lead}</p><div class="facts">${o.facts.map(f=>`<div class="fact"><b>${f[0]}</b><span>${f[1]}</span></div>`).join("")}</div><h3>알아두면 좋은 사실</h3><ul>${o.more.map(m=>`<li>${m}</li>`).join("")}</ul>`;detail.classList.add("show");document.getElementById("closeDetail").onclick=()=>detail.classList.remove("show");detail.scrollIntoView({behavior:"smooth",block:"start"})}
function filter(){const q=search.value.trim().toLowerCase();const list=objects.filter(o=>(o.name+" "+o.short+" "+o.lead+" "+o.keywords+" "+o.facts.flat().join(" ")+" "+o.more.join(" ")).toLowerCase().includes(q));render(list)}
cards.addEventListener("click",e=>{const b=e.target.closest("button[data-id]");if(b)showDetail(b.dataset.id)});search.addEventListener("input",filter);document.getElementById("clearSearch").onclick=()=>{search.value="";filter();search.focus();detail.classList.remove("show")};
render(objects);
const quizData=[
{q:"태양계 중심에서 빛과 열을 내는 천체는?",a:["태양","달","화성","혜성"],correct:0,why:"태양은 태양계의 중심에 있는 항성입니다."},
{q:"태양계의 행성은 모두 몇 개일까요?",a:["6개","7개","8개","9개"],correct:2,why:"태양계에는 수성부터 해왕성까지 여덟 행성이 있습니다."},
{q:"태양 가까이 다가가면 꼬리가 생길 수 있는 천체는?",a:["혜성","위성","항성","지구"],correct:0,why:"혜성은 태양의 열과 태양풍의 영향으로 코마와 꼬리가 만들어질 수 있습니다."},
{q:"지구의 자연 위성은 무엇일까요?",a:["금성","달","태양","세레스"],correct:1,why:"달은 지구 주위를 도는 자연 위성입니다."},
{q:"명왕성은 현재 어떤 분류에 속할까요?",a:["항성","행성","왜소행성","혜성"],correct:2,why:"명왕성은 왜소행성으로 분류됩니다."},
{q:"스스로 빛을 내는 천체를 무엇이라고 할까요?",a:["항성","자연 위성","소행성","달"],correct:0,why:"항성은 스스로 빛을 내며 태양도 항성입니다."}
];
const questions=document.getElementById("questions");
function buildQuiz(){questions.innerHTML=quizData.map((q,i)=>`<div class="q-card" data-q="${i}"><p>${i+1}. ${q.q}</p><div class="answers">${q.a.map((a,j)=>`<button type="button" data-a="${j}">${["①","②","③","④"][j]} ${a}</button>`).join("")}</div><div class="feedback"></div></div>`).join("");document.getElementById("score").textContent=""}
questions.addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(!b)return;const card=b.closest(".q-card");card.querySelectorAll("button").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");card.querySelector(".feedback").textContent=""});
document.getElementById("grade").onclick=()=>{let score=0,answered=0;questions.querySelectorAll(".q-card").forEach((card,i)=>{const chosen=card.querySelector("button.selected");const q=quizData[i];card.querySelectorAll("button").forEach(b=>b.classList.remove("correct","wrong"));if(chosen){answered++;if(Number(chosen.dataset.a)===q.correct){score++;chosen.classList.add("correct")}else{chosen.classList.add("wrong");card.querySelectorAll("button").forEach(b=>{if(Number(b.dataset.a)===q.correct)b.classList.add("correct")})}card.querySelector(".feedback").textContent=q.why}else{card.querySelector(".feedback").textContent="답을 선택하지 않았어. 정답: "+q.a[q.correct]}});document.getElementById("score").textContent=`점수: ${score} / ${quizData.length} (응답 ${answered}개)`};
document.getElementById("resetQuiz").onclick=buildQuiz;buildQuiz();
</script>
